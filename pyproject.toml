[project]
name = "slypy"
version = "0.1.0"
description = "Runtime type-on-type type checking"
readme = "README.md"
authors = [
    { name = "Oli Russell", email = "mrxoliver@gmail.com" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[project.urls]
homepage = "https://github.com/leontrolski/slypy"

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = """
  --tb=short
  -vv
"""
